# Showly nginx rate-limit zonları
# Bu dosyayı sunucuda şuraya kopyala: /etc/nginx/conf.d/showly-rate-limits.conf
# Sonra: sudo nginx -t && sudo systemctl reload nginx
#
# Notlar:
# - $binary_remote_addr → her ziyaretçi için ~16 byte; 10m bellek ≈ 160K IP saklar
# - rate → saniye başına izin verilen istek (sürekli akış)
# - burst (location'da) → kısa süreli ani artış toleransı
# - nodelay → fazla istekleri kuyruğa almak yerine direkt 503 dön

# Genel web (HTML/CSS/JS) — geniş ama makul
limit_req_zone $binary_remote_addr zone=showly_web:10m rate=30r/s;

# API genel — düzenli kullanım için yeterli
limit_req_zone $binary_remote_addr zone=showly_api:10m rate=20r/s;

# Login endpoint — brute-force koruması (sıkı)
limit_req_zone $binary_remote_addr zone=showly_login:10m rate=2r/s;

# Connection limit (her IP max paralel bağlantı sayısı)
limit_conn_zone $binary_remote_addr zone=showly_conn:10m;

# Rate limit aşılırsa 429 (Too Many Requests) döndür (default 503)
limit_req_status 429;
limit_conn_status 429;
