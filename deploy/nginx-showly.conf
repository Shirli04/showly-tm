# ─── Rate limit zonları (DDoS/brute-force koruması) ────────────────────────
# Bu blok http {} contextinde olmalı. Eğer /etc/nginx/nginx.conf içine eklemeyi
# tercih edersen, buradaki limit_req_zone tanımlarını oraya taşı; yoksa burada
# bırakırsan nginx -t hata verir. Çoğu Ubuntu kurulumunda http {} bloğu
# /etc/nginx/conf.d/*.conf dosyalarını include eder, o klasöre ayrı bir
# rate-limit.conf koymak en temizidir. Aşağıdaki örnek:
#
#   limit_req_zone $binary_remote_addr zone=showly_api:10m   rate=20r/s;
#   limit_req_zone $binary_remote_addr zone=showly_login:10m rate=2r/s;
#   limit_req_zone $binary_remote_addr zone=showly_web:10m   rate=30r/s;
#
# 10m bellek ≈ 160.000 IP saklar. rate = saniye başına izin verilen istek.
# Burst kısa süreli artışları yumuşatır.

# ── Wildcard subdomain: HTTP → HTTPS redirect ──────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<slug>[^.]+)\.showlytm\.store$;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Wildcard subdomain: HTTPS static store sites ────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ~^(?<slug>[^.]+)\.showlytm\.store$;

    ssl_certificate /etc/letsencrypt/live/showlytm.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/showlytm.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Her mağazanın HTML dosyaları /var/www/stores/{slug}/ klasöründe
    root /var/www/stores/$slug;
    index index.html;

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host showlytm.store;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

# ── Ana site: HTTP → HTTPS redirect ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name showlytm.store www.showlytm.store direct.showlytm.store;

    client_max_body_size 20M;

    # HTTP-01 challenge for certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.showlytm.store;

    ssl_certificate /etc/letsencrypt/live/showlytm.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/showlytm.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://showlytm.store$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name showlytm.store direct.showlytm.store;

    ssl_certificate /etc/letsencrypt/live/showlytm.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/showlytm.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        # ✅ Rate limit (varsa): genel web istekleri, 30/s + burst 60
        limit_req zone=showly_web burst=60 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ✅ Login endpoint için sıkı limit (brute-force koruması — 2/s + burst 5)
    location = /api/auth/login {
        limit_req zone=showly_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location /api/ {
        # ✅ API isteklerine genel limit (20/s + burst 40)
        limit_req zone=showly_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
